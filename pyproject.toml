[project]
name = "src"
requires-python = ">=3.14"
dependencies = [
    "pyyaml ~=6",
    "requests ~=2.32"
]

[dependency-groups]
dev = [
    "black",
    "isort"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.black]
line-length = 80

[tool.isort]
profile = "black"
