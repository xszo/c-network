# base profile
id: ""
# variables refered with '=name'
var: {}
# misc options
misc:
  # lag test
  test: http://1.1.1.1/
  t-dns: nic.com@1.1.1.1
  # dns over udp
  dns:
    # - 1.1.1.1
    # - 8.8.8.8
    - 223.5.5.5
    - 223.6.6.6
  # dns over https
  doh:
    # - https://1.1.1.1/dns-query
    # - https://8.8.8.8/dns-query
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
# routing info
route:
  - id: system
    node:
      type: static
      name: System
      list: [ -world, -direct, =node ]
    filter:
      - use: system
    icon:
      sort: 1
      emoji: 🏳️‍🌈
      sf: arrow.left.arrow.right.system
  - id: stream
    node:
      type: static
      name: Stream
      list: [ -world, -direct, =node ]
    filter:
      - use: stream
    icon:
      sort: 1
      emoji: 🏳️‍🌈
      sf: arrow.left.arrow.right.system

  - id: cn
    node:
      type: static
      name: R-CN
      list: [ -world, -direct, =node ]
    filter:
      - use: cn
    icon:
      sort: 2
      emoji: 🏳️‍🌈
      sf: arrow.forward.system
  - id: jp
    node:
      type: static
      name: R-JP
      list: [ -world, -direct, =node ]
    filter:
      - use: jp
    icon:
      sort: 2
      emoji: 🏳️‍🌈
      sf: arrow.forward.system
  - id: tw
    node:
      type: static
      name: R-TW
      list: [ -world, -direct, =node ]
    filter:
      - use: tw
    icon:
      sort: 2
      emoji: 🏳️‍🌈
      sf: arrow.forward.system
  - id: us
    node:
      type: static
      name: R-US
      list: [ -world, -direct, =node ]
    filter:
      - use: us
    icon:
      sort: 2
      emoji: 🏳️‍🌈
      sf: arrow.forward.system

  - id: world
    node:
      type: static
      name: Default
      list: [ -direct, -reject, =node ]
    filter:
      - use: world
      - type: main
    icon:
      sort: 0
      emoji: 🏳️‍🌈
      sf: arrow.left.arrow.right.system
node:
  # type, static manual set dest, test set based on lag test
  # list, include proxy, = ref pattern.region
  - { name: Node, type: test, list: =xx }
  - { name: CN, type: test, list: =cn }
  - { name: DE, type: test, list: =de }
  - { name: FR, type: test, list: =fr }
  - { name: GB, type: test, list: =gb }
  - { name: HK, type: test, list: =hk }
  - { name: JP, type: test, list: =jp }
  - { name: KR, type: test, list: =kr }
  - { name: NL, type: test, list: =nl }
  - { name: SG, type: test, list: =sg }
  - { name: TW, type: test, list: =tw }
  - { name: US, type: test, list: =us }
