route:
  - id: cn
    node: { id: direct }
    filter: [{ use: system }, { use: cn }]
  - id: tw
    node: { name: TW, type: test, list: =tw }
    filter: [{ use: tw }]
  - id: jp
    node: { name: JP, type: test, list: =jp }
    filter: [{ use: jp }]
