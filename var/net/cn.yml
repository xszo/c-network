id: cn
tar:
  - surge
  - clash
  - quantumult
  - shadowrocket
route:
  - id: cn
    node: { id: direct }
    filter: [ { use: cn }, { use: system } ]
  - id: tw
    node: { name: TW, type: test, list: =tw }
    filter: [ { use: tw }, { use: stream } ]
  - id: jp
    node: { name: JP, type: test, list: =jp }
    filter: [ { use: jp } ]
  - id: us
    node: { name: US, type: test, list: =us }
    filter: [ { use: us } ]
  - id: ww
    node: { id: tw }
    filter: [ { use: world }, { type: main } ]
node: []
